<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0f6b6d"/>
  <!-- Calendar body -->
  <rect x="7" y="9" width="18" height="15" rx="2" fill="#f3f6f7"/>
  <!-- Top bar / header -->
  <rect x="7" y="9" width="18" height="5" rx="2" fill="#d7ecec"/>
