  <!-- Binding rings -->
  <rect x="11" y="7" width="2" height="4" rx="1" fill="#f3f6f7"/>
  <rect x="19" y="7" width="2" height="4" rx="1" fill="#f3f6f7"/>
  <!-- Date grid dots / cells (minimal monogram) -->
  <rect x="10" y="16" width="3" height="2.5" rx="0.5" fill="#0f6b6d"/>
  <rect x="14.5" y="16" width="3" height="2.5" rx="0.5" fill="#0f6b6d"/>
  <rect x="19" y="16" width="3" height="2.5" rx="0.5" fill="#0f6b6d"/>
  <rect x="10" y="20" width="3" height="2.5" rx="0.5" fill="#0f6b6d"/>
  <rect x="14.5" y="20" width="3" height="2.5" rx="0.5" fill="#0a4f51"/>
  <rect x="19" y="20" width="3" height="2.5" rx="0.5" fill="#0f6b6d"/>
</svg>
